name: CI and Deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      APP_ENV: prod
      APP_SECRET: ci-only-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: ctype, iconv, mbstring
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint YAML
        run: php bin/console lint:yaml config --env=prod --no-debug

      - name: Lint Twig
        run: php bin/console lint:twig templates --env=prod --no-debug

      - name: Lint service container
        run: php bin/console lint:container --env=prod --no-debug